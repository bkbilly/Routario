<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Routario</title>

    <link rel="icon" href="icons/favicon.ico">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            if (theme === 'light') document.documentElement.classList.add('light-theme');
        })();
    </script>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
    <style>
        :root {
            color-scheme: dark;
            --bg-primary: #0a0e1a;
            --bg-secondary: #131825;
            --bg-tertiary: #1a2035;
            --bg-hover: #2a3447;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --accent-primary: #3b82f6;
            --accent-secondary: #8b5cf6;
            --border-color: #374151;
            --shadow-card: 0 25px 50px rgba(0,0,0,0.5);
        }
        
        :root[data-theme="light"],
        [data-theme="light"],
        body.light-theme {
            color-scheme: light;
            --bg-primary: #f1f3f7;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f8fafc;
            --bg-hover: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --accent-primary: #2563eb;
            --accent-secondary: #7c3aed;
            --border-color: #e2e8f0;
            --shadow-card: 0 20px 40px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.05);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            overflow-y: auto;
            padding: 1rem;
            box-sizing: border-box;
        }

        body::before {
            content: ''; position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.1) 0%, transparent 50%);
            animation: pulse 10s ease infinite; z-index: -1;
        }
        [data-theme="light"] body::before,
        body.light-theme::before {
            background: radial-gradient(circle at 50% 50%, rgba(37, 99, 235, 0.05) 0%, transparent 50%);
        }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        .login-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 3rem;
            width: 100%;
            max-width: 400px;
            box-shadow: var(--shadow-card);
            text-align: center;
        }

        @media (max-height: 620px), (max-width: 480px) {
            body { align-items: flex-start; }
            .login-card { padding: 2rem 1.25rem; margin: 1rem 0; }
            .logo { margin-bottom: 0.5rem; }
            p { margin-bottom: 1.25rem; }
            .form-group { margin-bottom: 1rem; }
        }

        .logo { font-size: 3rem; margin-bottom: 1rem; }
        .logo img { width: 96px; height: 96px; object-fit: contain; }
        h1 { margin-bottom: 0.5rem; font-weight: 700; }
        p { color: var(--text-secondary); margin-bottom: 2rem; font-size: 0.9rem; }

        .form-group { margin-bottom: 1.5rem; text-align: left; }
        .form-label { display: block; font-size: 0.85rem; margin-bottom: 0.5rem; color: var(--text-secondary); }
        .form-input {
            width: 100%; padding: 0.75rem 1rem;
            box-sizing: border-box;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            transition: all 0.2s;
        }
        .form-input:focus { outline: none; border-color: var(--accent-primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }

        .password-input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-input-wrap .form-input {
            padding-right: 2.75rem;
        }
        .password-toggle-btn {
            position: absolute;
            right: 0.4rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 1.25rem;
            padding: 0.35rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: color 0.2s, background-color 0.2s;
        }
        .password-toggle-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.06);
        }
        .password-toggle-btn:focus-visible {
            outline: 2px solid var(--accent-primary);
        }

        .btn {
            width: 100%; padding: 0.75rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none; border-radius: 8px;
            color: white; font-weight: 600; font-size: 1rem;
            cursor: pointer; transition: transform 0.2s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(59, 130, 246, 0.3); }
        .btn-secondary {
            margin-top: 0.75rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
        }
        .btn-secondary:hover {
            background: var(--bg-hover);
        }
        .btn-sso { display: none; }
        .btn-magic { display: none; }

        .error-msg { color: #ef4444; font-size: 0.85rem; margin-top: 1rem; display: none; line-height: 1.4; }
        .success-msg {
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: var(--color-success, #22c55e);
            border-radius: 8px;
            padding: 0.85rem 1rem;
            font-size: 0.88rem;
            line-height: 1.4;
            margin-top: 1rem;
            text-align: left;
            display: none;
        }
        .switch-link {
            display: inline-block;
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--accent-primary);
            text-decoration: none;
            cursor: pointer;
            font-weight: 500;
        }
        .switch-link:hover {
            text-decoration: underline;
        }
        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 0.75rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <img src="icons/icon-192-full.png" class="logo-icon">
        </div>
        <h1 id="loginCardTitle">Welcome Back</h1>
        <p id="loginCardSubtitle">Sign in to your GPS Fleet Tracker</p>

        <!-- Verifying Token State -->
        <div id="magicVerifyingState" style="display:none;padding:1.5rem 0;">
            <div class="spinner"></div>
            <div style="font-weight:600;font-size:1.05rem;color:var(--text-primary);margin-bottom:0.25rem;">Verifying sign-in link…</div>
            <div style="font-size:0.85rem;color:var(--text-muted);">Please wait while we authenticate your session.</div>
        </div>
        
        <!-- Standard Password Form -->
        <form id="passwordLoginForm" onsubmit="handleLogin(event)" autocapitalize="off" autocorrect="off" spellcheck="false">
            <div class="form-group">
                <label class="form-label">Username or Email</label>
                <input type="text" id="username" class="form-input" required autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="email" enterkeyhint="next">
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="password-input-wrap">
                    <input type="password" id="password" class="form-input" required autocomplete="current-password">
                    <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility" title="Show password">
                        <i class="mdi mdi-eye-outline" id="togglePasswordIcon"></i>
                    </button>
                </div>
            </div>
            <div class="form-group" id="mfaGroup" style="display:none;">
                <label class="form-label">Authenticator or Recovery Code</label>
                <input type="text" id="mfaCode" class="form-input" inputmode="numeric" autocomplete="one-time-code">
            </div>
            <button type="submit" class="btn" id="loginBtn">Sign In</button>
            <button type="button" class="btn btn-secondary btn-magic" id="magicLinkBtn" onclick="switchToMagicLink()"><i class="mdi mdi-email-fast-outline"></i> Sign in with Email Link</button>
            <button type="button" class="btn btn-secondary" id="passkeyBtn" onclick="handlePasskeyLogin()"><i class="mdi mdi-key-variant"></i> Sign in with passkey</button>
            <button type="button" class="btn btn-secondary btn-sso" id="ssoBtn" onclick="handleSsoLogin()">Sign in with SSO</button>
            <div class="error-msg" id="errorMsg">Invalid credentials</div>
        </form>

        <!-- Magic Link Form (Available when SMTP enabled) -->
        <form id="magicLinkForm" onsubmit="handleMagicLinkRequest(event)" style="display:none;" autocapitalize="off" autocorrect="off" spellcheck="false">
            <div class="form-group">
                <label class="form-label">Account Email Address</label>
                <input type="email" id="magicEmail" class="form-input" required placeholder="you@company.com" autocomplete="email" enterkeyhint="send">
            </div>
            <button type="submit" class="btn" id="magicSubmitBtn"><i class="mdi mdi-send"></i> Send Sign-In Link</button>
            <div class="success-msg" id="magicSuccessMsg"></div>
            <div class="error-msg" id="magicErrorMsg"></div>
            <div>
                <a class="switch-link" onclick="switchToPasswordLogin()"><i class="mdi mdi-arrow-left"></i> Back to username & password</a>
            </div>
        </form>
    </div>
    <script src="js/demo-mock-api.js"></script>
<script src="js/config.js"></script>
    <script>
        function togglePasswordVisibility() {
            const input = document.getElementById('password');
            const icon = document.getElementById('togglePasswordIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'mdi mdi-eye-off-outline';
                icon.parentElement.setAttribute('title', 'Hide password');
            } else {
                input.type = 'password';
                icon.className = 'mdi mdi-eye-outline';
                icon.parentElement.setAttribute('title', 'Show password');
            }
        }

        function switchToMagicLink() {
            document.getElementById('passwordLoginForm').style.display = 'none';
            document.getElementById('magicLinkForm').style.display = 'block';
            document.getElementById('loginCardTitle').textContent = 'Email Sign-In';
            document.getElementById('loginCardSubtitle').textContent = "We'll send a one-time sign-in link to your inbox.";
            document.getElementById('magicSuccessMsg').style.display = 'none';
            document.getElementById('magicErrorMsg').style.display = 'none';
            const userVal = document.getElementById('username').value.trim();
            if (userVal.includes('@')) {
                document.getElementById('magicEmail').value = userVal;
            }
            document.getElementById('magicEmail').focus();
        }

        function switchToPasswordLogin() {
            document.getElementById('magicLinkForm').style.display = 'none';
            document.getElementById('passwordLoginForm').style.display = 'block';
            document.getElementById('loginCardTitle').textContent = 'Welcome Back';
            document.getElementById('loginCardSubtitle').textContent = 'Sign in to your GPS Fleet Tracker';
            document.getElementById('errorMsg').style.display = 'none';
        }

        const loginSlug = (() => {
            const match = window.location.pathname.match(/^\/login\/([^/]+)\/?$/);
            return match ? decodeURIComponent(match[1]) : null;
        })();
        if (loginSlug) applyCompanyLoginBranding(loginSlug);

        const storedLoginError = localStorage.getItem('login_error');
        if (storedLoginError) {
            localStorage.removeItem('login_error');
            const err = document.getElementById('errorMsg');
            err.textContent = storedLoginError;
            err.style.display = 'block';
        }

        loadSsoConfig();
        loadAuthMethods();
        checkMagicLinkLanding();

        async function loadAuthMethods() {
            try {
                const res = await fetch(`${API_BASE}/auth-methods`);
                if (!res.ok) return;
                const data = await res.json();
                if (data.email_magic_link) {
                    const btn = document.getElementById('magicLinkBtn');
                    if (btn) btn.style.display = 'block';
                }
            } catch (_) {}
        }

        async function handleMagicLinkRequest(e) {
            e.preventDefault();
            const btn = document.getElementById('magicSubmitBtn');
            const successEl = document.getElementById('magicSuccessMsg');
            const errEl = document.getElementById('magicErrorMsg');
            const email = document.getElementById('magicEmail').value.trim();

            btn.disabled = true;
            btn.innerHTML = '<span class="loading" style="display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;margin-right:6px;animation:spin 0.8s linear infinite;"></span> Sending…';
            successEl.style.display = 'none';
            errEl.style.display = 'none';

            try {
                const res = await fetch(`${API_BASE}/auth/magic-link/request`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                if (res.ok) {
                    successEl.innerHTML = `<div style="display:flex;align-items:flex-start;gap:0.5rem;"><i class="mdi mdi-email-check" style="font-size:1.25rem;"></i><div><strong>Check your email!</strong><div style="margin-top:0.25rem;font-size:0.83rem;">${data.message || 'A sign-in link has been sent. It is valid for 15 minutes.'}</div></div></div>`;
                    successEl.style.display = 'block';
                } else {
                    errEl.textContent = data.detail || 'Could not send sign-in link.';
                    errEl.style.display = 'block';
                }
            } catch (_) {
                errEl.textContent = 'Connection error. Please try again.';
                errEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="mdi mdi-send"></i> Send Sign-In Link';
            }
        }

        async function checkMagicLinkLanding() {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('magic_token') || params.get('token');
            if (!token) return;

            // Hide normal forms and show verification state
            document.getElementById('passwordLoginForm').style.display = 'none';
            document.getElementById('magicLinkForm').style.display = 'none';
            document.getElementById('magicVerifyingState').style.display = 'block';
            document.getElementById('loginCardTitle').textContent = 'Authenticating';
            document.getElementById('loginCardSubtitle').textContent = 'Verifying your magic link…';

            try {
                const res = await fetch(`${API_BASE}/auth/magic-link/verify`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });

                const data = await res.json();
                if (res.ok) {
                    storeLoginData(data);
                    await syncUserTimezone();
                    window.location.href = 'gps-dashboard.html';
                } else {
                    document.getElementById('magicVerifyingState').style.display = 'none';
                    document.getElementById('passwordLoginForm').style.display = 'block';
                    document.getElementById('loginCardTitle').textContent = 'Sign In';
                    document.getElementById('loginCardSubtitle').textContent = 'Sign in to your GPS Fleet Tracker';
                    const err = document.getElementById('errorMsg');
                    err.textContent = data.detail || 'This sign-in link is invalid or has expired.';
                    err.style.display = 'block';
                }
            } catch (_) {
                document.getElementById('magicVerifyingState').style.display = 'none';
                document.getElementById('passwordLoginForm').style.display = 'block';
                const err = document.getElementById('errorMsg');
                err.textContent = 'Connection error while verifying magic link.';
                err.style.display = 'block';
            }
        }

        function b64urlToBuffer(value) {
            const padding = '='.repeat((4 - value.length % 4) % 4);
            const base64 = (value + padding).replace(/-/g, '+').replace(/_/g, '/');
            const raw = atob(base64);
            return Uint8Array.from(raw, c => c.charCodeAt(0)).buffer;
        }

        function bufferToB64url(buffer) {
            const bytes = new Uint8Array(buffer || []);
            let raw = '';
            bytes.forEach(b => { raw += String.fromCharCode(b); });
            return btoa(raw).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
        }

        function parseCredentialOptions(optionsJson, mode) {
            const options = typeof optionsJson === 'string' ? JSON.parse(optionsJson) : optionsJson;
            options.challenge = b64urlToBuffer(options.challenge);
            if (mode === 'create') {
                options.user.id = b64urlToBuffer(options.user.id);
                options.excludeCredentials = (options.excludeCredentials || []).map(c => ({ ...c, id: b64urlToBuffer(c.id) }));
            } else {
                options.allowCredentials = (options.allowCredentials || []).map(c => ({ ...c, id: b64urlToBuffer(c.id) }));
            }
            return options;
        }

        function credentialToJson(credential) {
            const response = credential.response;
            const data = {
                id: credential.id,
                rawId: bufferToB64url(credential.rawId),
                type: credential.type,
                clientExtensionResults: credential.getClientExtensionResults ? credential.getClientExtensionResults() : {},
                response: {
                    clientDataJSON: bufferToB64url(response.clientDataJSON),
                },
            };
            if (credential.authenticatorAttachment) data.authenticatorAttachment = credential.authenticatorAttachment;
            if (response.attestationObject) data.response.attestationObject = bufferToB64url(response.attestationObject);
            if (response.authenticatorData) data.response.authenticatorData = bufferToB64url(response.authenticatorData);
            if (response.signature) data.response.signature = bufferToB64url(response.signature);
            if (response.userHandle) data.response.userHandle = bufferToB64url(response.userHandle);
            return data;
        }

        function storeLoginData(data) {
            localStorage.setItem('auth_token', data.access_token);
            localStorage.setItem('user_id', data.user_id);
            localStorage.setItem('username', data.username);
            localStorage.setItem('is_admin', data.is_admin);
            localStorage.setItem('is_company_admin', data.is_company_admin || false);
            localStorage.setItem('company_id', data.company_id ?? '');
            localStorage.setItem('units', data.units || 'metric');
            localStorage.setItem('currency', data.currency || 'EUR');
            localStorage.setItem('theme', data.theme || 'dark');
            localStorage.setItem('sidebar_compact', data.sidebar_compact === true ? 'true' : 'false');
            localStorage.setItem('time_format', data.time_format || 'auto');
            localStorage.setItem('date_format', data.date_format || 'auto');
            localStorage.setItem('permissions', JSON.stringify(data.permissions || []));
            if (String(data.company_id ?? '') !== localStorage.getItem('company_login_slug_company_id')) {
                localStorage.removeItem('company_login_slug');
                localStorage.removeItem('company_login_slug_company_id');
            }
        }

        async function loadSsoConfig() {
            try {
                const res = await fetch(`${API_BASE}/sso/config`);
                if (!res.ok) return;
                const data = await res.json();
                if (!data.enabled) return;
                const btn = document.getElementById('ssoBtn');
                btn.textContent = `Sign in with ${data.provider_name || 'SSO'}`;
                btn.style.display = 'block';
            } catch (_) {}
        }

        function handleSsoLogin() {
            window.location.href = `${API_BASE}/sso/login`;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const err = document.getElementById('errorMsg');
            
            btn.disabled = true;
            btn.textContent = 'Signing in...';
            err.style.display = 'none';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const mfaCode = document.getElementById('mfaCode').value.trim();

            try {
                const res = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, mfa_code: mfaCode || null })
                });

                if (res.ok) {
                    const data = await res.json();
                    if (data.mfa_required) {
                        document.getElementById('mfaGroup').style.display = 'block';
                        document.getElementById('mfaCode').required = true;
                        document.getElementById('mfaCode').focus();
                        err.textContent = 'Enter your authenticator or recovery code';
                        err.style.display = 'block';
                        btn.disabled = false;
                        btn.textContent = 'Verify Code';
                        return;
                    }
                    storeLoginData(data);
                    await syncUserTimezone();
                    window.location.href = 'gps-dashboard.html';
                } else {
                    err.textContent = 'Invalid username or password';
                    err.style.display = 'block';
                }
            } catch (e) {
                err.textContent = 'Connection error. Please try again.';
                err.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        }

        async function handlePasskeyLogin() {
            const btn = document.getElementById('passkeyBtn');
            const err = document.getElementById('errorMsg');
            if (!window.PublicKeyCredential) {
                err.textContent = 'Passkeys are not supported by this browser';
                err.style.display = 'block';
                return;
            }
            btn.disabled = true;
            btn.textContent = 'Waiting for passkey...';
            err.style.display = 'none';
            try {
                const username = document.getElementById('username').value.trim();
                const optionsRes = await fetch(`${API_BASE}/passkeys/login/options`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username || null }),
                });
                if (!optionsRes.ok) throw new Error('Unable to start passkey login');
                const challenge = await optionsRes.json();
                const credential = await navigator.credentials.get({
                    publicKey: parseCredentialOptions(challenge.options, 'get'),
                });
                const verifyRes = await fetch(`${API_BASE}/passkeys/login/verify`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ state: challenge.state, credential: credentialToJson(credential) }),
                });
                if (!verifyRes.ok) {
                    const data = await verifyRes.json().catch(() => ({}));
                    throw new Error(data.detail || 'Passkey login failed');
                }
                const data = await verifyRes.json();
                storeLoginData(data);
                await syncUserTimezone();
                window.location.href = 'gps-dashboard.html';
            } catch (e) {
                err.textContent = e.name === 'NotAllowedError' ? 'Passkey login was cancelled' : (e.message || 'Passkey login failed');
                err.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign in with passkey';
            }
        }
    </script>
</body>
</html>
